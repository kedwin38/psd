name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PNPM_VERSION: "10.33.0"
  NODE_VERSION: "22"

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Dependents typecheck against these packages' emitted .d.ts files.
      - name: Build shared packages
        run: |
          pnpm --filter @psd-studio/scene-graph run build
          pnpm --filter @psd-studio/psd-engine run build
          pnpm --filter @psd-studio/canvas-renderer run build
          pnpm --filter @psd-studio/api run prisma:generate

      - name: Typecheck every package
        run: pnpm run typecheck

      - name: Lint every package
        run: pnpm run lint

      - name: Unit tests (scene-graph, psd-engine)
        run: pnpm run test:unit

  integration-and-e2e:
    name: API integration tests + full e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: psdstudio
          POSTGRES_PASSWORD: psdstudio_dev_pw
          POSTGRES_DB: psdstudio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U psdstudio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://psdstudio:psdstudio_dev_pw@localhost:5432/psdstudio?schema=public
      REDIS_URL: redis://localhost:6379
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_NAME: PSD Template Studio CI
      WEBAUTHN_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-prod-please-0000000000
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-prod-please-0000000000
      PASSWORD_PEPPER: ci-only-pepper-not-for-prod-please
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: ./storage-data
      CORS_ORIGIN: http://localhost:5173
      API_PUBLIC_URL: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @psd-studio/scene-graph run build
          pnpm --filter @psd-studio/psd-engine run build
          pnpm --filter @psd-studio/canvas-renderer run build

      - name: Run database migrations
        run: pnpm --filter @psd-studio/api run prisma:deploy

      - name: API integration tests (builds the API, then runs against real Postgres/Redis)
        run: pnpm run test:api

      - name: Install Playwright's Chromium
        run: pnpm --filter @psd-studio/e2e exec playwright install --with-deps chromium

      - name: Start API
        run: |
          cd apps/api
          mkdir -p storage-data
          nohup node dist/main.js > /tmp/api.log 2>&1 &
          npx wait-on -t 30000 http://localhost:3000/api/v1/categories

      - name: Start worker
        run: |
          cd apps/api
          nohup node dist/worker/main.js > /tmp/worker.log 2>&1 &
          sleep 2

      - name: Build and start the web app
        run: |
          pnpm --filter @psd-studio/web exec vite build --mode production
          nohup pnpm --filter @psd-studio/web exec vite preview --port 5173 --strictPort > /tmp/web.log 2>&1 &
          npx wait-on -t 30000 http://localhost:5173

      - name: Run the e2e golden-path suite
        run: pnpm --filter @psd-studio/e2e run test

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "--- api ---"; cat /tmp/api.log || true
          echo "--- worker ---"; cat /tmp/worker.log || true
          echo "--- web ---"; cat /tmp/web.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
